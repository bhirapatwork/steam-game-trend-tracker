[project]
name = "steam-tracker"
version = "0.1.0"
description = "Track hourly Steam concurrent player counts and analyze game and genre trends"
readme = "README.md"
authors = [
    { name = "bhirapat", email = "bhirapat.work@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "httpx>=0.28.1",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "tenacity>=9.2.1",
]

[project.scripts]
steam-tracker = "steam_tracker:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
